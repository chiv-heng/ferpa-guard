[project]
name = "ferpa-guard"
version = "0.1.0"
description = "K-12 AI safety layer that detects and blocks student PII before it enters LLM context windows"
requires-python = ">=3.10"

[project.optional-dependencies]
mcp  = ["mcp>=1.30,<2"]
xlsx = ["openpyxl>=3.0"]
pdf  = ["pymupdf>=1.20"]
docx = ["python-docx>=0.8"]
all  = ["ferpa-guard[mcp,xlsx,pdf,docx]"]

# RELEASE BLOCKER: do not publish this layout to any package index —
# top-level "shared" collides in site-packages. Rename to ferpa_guard first.
# (Consensus decision Q4, .planning/phases/09-fork-merge/SPEC.md)
[tool.setuptools]
packages = ["shared"]
